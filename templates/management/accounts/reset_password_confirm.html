{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Şifre Sıfırla - Konasoft</title>

    <meta name="description" content="Şifre sıfırlama işlemi için yeni şifre belirleyin.">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700"/>
    <link href="{% static 'management/plugins/global/plugins.bundle.css' %}" rel="stylesheet" type="text/css"/>
    <link href="{% static 'management/css/style.bundle.css' %}" rel="stylesheet" type="text/css"/>

    <style>
        .modal-content {
            width: 67vw;
        }

        .custombtn {
            background: transparent;
            color: white;
            border: none;
        }

        .loginlink {
            display: flex;
            justify-content: end;
            align-items: end;
            color: white;
            width: 93vw;
        }

        .modal-dialog {
            margin: auto;
            max-width: 67vw;
        }

        /* NEW: Başlık için güvenli boşluk ve tipografi */
        .auth-title {
            margin: 0 0 32px 0; /* başlık ile ilk input arasında boşluk */
            text-align: center;
            font-weight: 600;
            font-size: 1.5rem;
            color: #6b7280;
        }

        @media (max-width: 992px) {
            .loginlink {
                width: 93vw;
                margin-left: 1em;
                margin-bottom: 1em;
                position: relative !important;
            }
        }

        @media (min-width: 992px) {
            .loginlink {
                width: 93vw;
                margin-left: 1em;
                margin-bottom: 1em;
            }
        }
    </style>
</head>
<body id="kt_body" class="app-blank">

<div class="d-flex flex-column flex-root" id="kt_app_root">
    <div class="d-flex flex-column flex-lg-row flex-column-fluid">
        <div class="d-flex flex-column flex-lg-row-fluid w-lg-50 p-10 order-2 order-lg-1"
             style="padding:1em!important;">
            <div class="d-flex flex-center flex-column flex-lg-row-fluid">
                <div class="w-lg-500px p-10">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} mb-4">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" class="form w-100">
                        {% csrf_token %}

                        <div class="text-center" style="margin-bottom:50px!important;">
                            <img alt="Logo" width="450x" class="logo-mobile-image"
                                 src="{% static 'theme/img/new_logo/1.png' %}"/>
                        </div>

                        <h2 class="auth-title">Şifre Sıfırlama</h2>

                        <div id="inlineErrors"
                             class="alert alert-danger mb-4 {% if not pw_error %}d-none{% endif %}">
                            {{ pw_error }}
                        </div>

                        <div class="fv-row mb-8">
                            <input type="password" id="pw1" placeholder="Yeni Şifre"
                                   name="new_password" class="form-control bg-transparent"
                                   minlength="8" autocomplete="new-password" required>
                            <div class="form-text">Şifre en az 8 karakter olmalıdır.</div>
                        </div>

                        <div class="fv-row mb-8">
                            <input type="password" id="pw2" placeholder="Yeni Şifre (Tekrar)"
                                   name="new_password_confirm" class="form-control bg-transparent"
                                   minlength="8" autocomplete="new-password" required>
                            <div id="pw2Err"
                                 class="invalid-feedback d-block"
                                 style="{% if not pw2_error %}display:none;{% endif %}">{{ pw2_error }}</div>
                        </div>

                        <div class="d-grid mb-10">
                            <button type="submit" id="resetSubmit" class="btn btn-primary">
                                <span class="indicator-label">Şifreyi Sıfırla</span>
                                <span class="indicator-progress">Lütfen Bekleyiniz...
                                  <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="d-flex flex-lg-row-fluid w-lg-50 bgi-size-cover bgi-position-center order-1 order-lg-2"
             style="background-image:url(/static/management/img/dashboard.jpg); min-height:200px;">
        </div>
    </div>
</div>

<script src="{% static 'management/plugins/global/plugins.bundle.js' %}"></script>
<script src="{% static 'management/js/scripts.bundle.js' %}"></script>

<script>
    (function () {
        const form = document.querySelector('form');
        const pw1 = document.getElementById('pw1');
        const pw2 = document.getElementById('pw2');
        const submitBtn = document.getElementById('resetSubmit');
        const errBox = document.getElementById('inlineErrors');
        const pw2Err = document.getElementById('pw2Err');

        function setGlobalError(msg) {
            if (msg) {
                errBox.textContent = msg;
                errBox.classList.remove('d-none');
            } else {
                errBox.textContent = '';
                errBox.classList.add('d-none');
            }
        }

        function validate() {
            const p1 = (pw1.value || '').trim();
            const p2 = (pw2.value || '').trim();

            if (p1.length > 0 && p1.length < 8) {
                setGlobalError('Şifre en az 8 karakter olmalıdır.');
                pw1.classList.add('is-invalid');
            } else {
                setGlobalError('');
                pw1.classList.remove('is-invalid');
            }

            if (p2.length > 0 && p1 !== p2) {
                pw2Err.style.display = '';
                pw2.classList.add('is-invalid');
            } else {
                pw2Err.style.display = 'none';
                pw2.classList.remove('is-invalid');
            }

            const invalidLen = (p1.length > 0 && p1.length < 8);
            const mismatch = (p2.length > 0 && p1 !== p2);
            submitBtn.disabled = invalidLen || mismatch;
            return !(invalidLen || mismatch);
        }

        pw1.addEventListener('input', validate);
        pw2.addEventListener('input', validate);
        form.addEventListener('submit', function (e) {
            if (!validate()) e.preventDefault();
        });
    })();
</script>

</body>
</html>
