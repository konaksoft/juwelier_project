{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <title>Kuyum Plus by Konasoft | Kuyumcu Yönetim Programı & ERP Çözümleri</title>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <meta name="description"
          content="Konasoft’un geliştirdiği Kuyum Plus ile envanter, perakende, toptan, cari, barkodlama ve RFID sayım süreçlerinizi tek panelde yönetin; yapay zekâ destekli raporlarla kârlılığınızı artırın.">
    <meta name="keywords"
          content="Kuyum Plus, kuyumcu programı, konasoft, kuyumcu ERP, altın stok takibi, cari yönetimi, RFID sayım, kuyumculuk yazılımı">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta property="og:title" content="Kuyum Plus Kuyumcu Yönetim Programı | Konasoft"/>
    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://www.konasoft.com/kuyumplus/"/>
    <meta property="og:description"
          content="Kuyum Plus ile stoktan satışa, cari mutabakattan detaylı raporlamaya kadar tüm kuyumcu işlemleriniz dijitalleşsin."/>
    <meta property="og:image" content="https://www.konasoft.com/static/theme/img/new_logo/1.png"/>

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kuyum Plus | Konasoft Kuyumcu Yönetim Programı">
    <meta name="twitter:description"
          content="RFID hızlı sayım, barkod & QR entegrasyonu ve günlük otomatik raporlarla kuyumculukta tam kontrol.">
    <meta name="twitter:image" content="https://www.konasoft.com/static/theme/img/new_logo/1.png">

    <link rel="canonical" href="https://www.konasoft.com/kuyumplus/"/>
    <link rel="shortcut icon" href="{% static 'theme/img/new_logo/1.png' %}"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700"/>
    <link href="{% static 'management/plugins/global/plugins.bundle.css' %}" rel="stylesheet" type="text/css"/>
    <link href="{% static 'management/css/style.bundle.css' %}" rel="stylesheet" type="text/css"/>

</head>

<body id="kt_body" class="app-blank">

<script>
    var defaultThemeMode = "light";
    var themeMode;
    if (document.documentElement) {
        if (document.documentElement.hasAttribute("data-bs-theme-mode")) {
            themeMode = document.documentElement.getAttribute("data-bs-theme-mode");
        } else {
            if (localStorage.getItem("data-bs-theme") !== null) {
                themeMode = localStorage.getItem("data-bs-theme");
            } else {
                themeMode = defaultThemeMode;
            }
        }
        if (themeMode === "system") {
            themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-bs-theme", themeMode);
    }
</script>

<div class="d-flex flex-column flex-root" id="kt_app_root">
    <div class="d-flex flex-column flex-lg-row flex-column-fluid">
        <div class="d-flex flex-column flex-lg-row-fluid w-lg-50 p-10 order-2 order-lg-1"
             style="padding: 1em!important;">
            <div class="d-flex flex-center flex-column flex-lg-row-fluid">
                <div class="w-lg-500px p-10">
                    {% for message in messages %}

                        <div class="alert alert-{{ message.tags }}" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}

                    <form id="login_form" method="post" class="form w-100" method="post" novalidate="novalidate"
                          id="kt_sign_in_form">
                        {% csrf_token %}

                        <div class="text-center " style="margin-bottom:50px !important;">
                            <a href="{% url 'login' %}">
                                <img alt="Logo" width="450x" class="logo-mobile-image"
                                     src="{% static 'theme/img/new_logo/1.png' %}"/>
                            </a>

                        </div>

                        <div class="separator separator-content " style="margin-bottom:60px !important;">
                            <span class="w-125px text-gray-500 fw-semibold fs-2">Hoşgeldiniz</span>
                        </div>

                        <div class="fv-row mb-8">
                            <input type="text" placeholder="E-posta"
                                   name="forgot_email" autocomplete="off"
                                   class="form-control bg-transparent" required>
                        </div>

                        <div class="d-grid mb-10">
                            <button type="submit" id="kt_sign_in_submit" class="btn btn-primary">
                                <span class="indicator-label">Şifre Sıfırlama</span>
                                <span class="indicator-progress">Lütfen Bekleyin...
										<span class="spinner-border spinner-border-sm align-middle ms-2"></span></span>
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>

        <div class="d-flex flex-lg-row-fluid w-lg-50 bgi-size-cover bgi-position-center order-1 order-lg-2"
             style="background-image: url(/static/management/img/dashboard.jpg); min-height: 200px;">
            <div class="d-flex flex-column flex-center py-7 py-lg-15 px-5 px-md-15 w-100">
            </div>
        </div>
    </div>
</div>

<script src="{% static 'management/plugins/global/plugins.bundle.js' %}"></script>
<script src="{% static 'management/js/scripts.bundle.js' %}"></script>
<script src="{% static 'management/js/custom/authentication/sign-in/two-factor.js' %}"></script>
<script>
    $(function () {
        $(".preloader").fadeOut();
    });

    var sec = $("#duration").text();
    setInterval(function () {
        sec = parseInt(sec) - 1;
        if (sec == 0) {
            $("#token").val("");
            window.location.href = "/";
        }
        $("#duration").text(sec);
    }, 1000)

    $('#to-recover').on("click", function () {
        $("#login_form").slideUp();
        $("#recoverform").fadeIn();
    });

    "use strict";
    var KTSigninTwoFactor = function () {
        var t, e;
        return {
            init: function () {
                var n, i, o, u, r, c;
                t = document.querySelector("#kt_sing_in_two_factor_form"), (e = document.querySelector("#kt_sing_in_two_factor_submit")).addEventListener("click", (function (n) {
                    n.preventDefault();
                    var i = !0, o = [].slice.call(t.querySelectorAll('input[maxlength="1"]'));
                    var fullCode = "";
                    o.map((function (t) {
                        "" !== t.value && 0 !== t.value.length ? fullCode += t.value : (i = !1);
                    }));

                    if (i) {
                        document.getElementById('full_code').value = fullCode;
                        e.setAttribute("data-kt-indicator", "on");
                        e.disabled = !0;

                        // Formu manuel olarak gönder
                        t.submit();

                        setTimeout((function () {
                            e.removeAttribute("data-kt-indicator");
                            e.disabled = !1;
                        }), 1e3);
                    } else {
                        swal.fire({
                            text: "Doğru Kodu Girin ve Tekrar Deneyin.",
                            icon: "error",
                            buttonsStyling: !1,
                            confirmButtonText: "Okudum Onaylıyorum!",
                            customClass: {confirmButton: "btn fw-bold btn-light-primary"}
                        }).then((function () {
                            KTUtil.scrollTop();
                        }));
                    }
                }));

                n = t.querySelector("[name=code_1]");
                i = t.querySelector("[name=code_2]");
                o = t.querySelector("[name=code_3]");
                u = t.querySelector("[name=code_4]");
                r = t.querySelector("[name=code_5]");
                c = t.querySelector("[name=code_6]");

                n.focus();
                n.addEventListener("keyup", (function () {
                    1 === this.value.length && i.focus();
                }));
                i.addEventListener("keyup", (function () {
                    1 === this.value.length && o.focus();
                }));
                o.addEventListener("keyup", (function () {
                    1 === this.value.length && u.focus();
                }));
                u.addEventListener("keyup", (function () {
                    1 === this.value.length && r.focus();
                }));
                r.addEventListener("keyup", (function () {
                    1 === this.value.length && c.focus();
                }));
                c.addEventListener("keyup", (function () {
                    1 === this.value.length && c.blur();
                }));
            }
        }
    }();
    KTUtil.onDOMContentLoaded((function () {
        KTSigninTwoFactor.init();
    }));
</script>
</body>
</html>
