{% extends 'management/base.html' %}
{% load static %}

{% block body %}
    <div class="app-main flex-column flex-row-fluid mt-2" id="kt_app_main">
        <div class="app-container container-xxl">
            <div class="card">
                <div class="card-header justify-content-between">
                    <h3 class="card-title">Sohbet: {{ conversation.phone_number }}</h3>
                    <a href="{% url 'whatsapp:dashboard' %}" class="btn btn-sm btn-light"
                       onclick="history.back();return false;">← Geri</a>
                </div>
                <div class="card-body" style="height: 70vh; display:flex; flex-direction:column;">
                    <div id="chat-box"
                         style="flex:1; overflow:auto; padding:12px; background:#f8f9fa; border-radius:8px;"></div>
                    <form id="send-form" class="mt-3" method="post">
                        {% csrf_token %}
                        <div class="input-group">
                            <input type="text" class="form-control" id="msg" placeholder="Mesaj yazın..."
                                   autocomplete="off"/>
                            <button class="btn btn-primary" type="submit">Gönder</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block footer %}
    <script>
        const convId = {{ conversation.id }};
        const messagesUrl = "{% url 'whatsapp:api_messages' conversation.id %}";
        const sendUrl = "{% url 'whatsapp:api_send_text' %}";

        function getCSRFCookie(name = 'csrftoken') {
            const m = document.cookie.match(new RegExp('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)'));
            return m ? decodeURIComponent(m[2]) : '';
        }

        function bubble(m) {
            const me = (m.dir === "OUT");
            const wrap = document.createElement('div');
            wrap.style.display = 'flex';
            wrap.style.margin = '6px 0';
            wrap.style.justifyContent = me ? 'flex-end' : 'flex-start';

            const b = document.createElement('div');
            b.style.maxWidth = '70%';
            b.style.padding = '10px 12px';
            b.style.borderRadius = '12px';
            b.style.background = me ? '#e7f1ff' : 'white';
            b.style.border = '1px solid #e2e8f0';
            b.style.whiteSpace = 'pre-wrap';
            b.innerText = m.text || (m.media && m.media.type) || '';
            wrap.appendChild(b);
            return wrap;
        }

        async function loadMessages() {
            const r = await fetch(messagesUrl);
            const data = await r.json();
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            for (const m of data.messages) {
                box.appendChild(bubble(m));
            }
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('send-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('msg').value.trim();
            if (!text) return;
            const r = await fetch(sendUrl, {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFCookie()
                },
                body: JSON.stringify({conversation_id: convId, text})
            });
            const js = await r.json();
            if (js.result) {
                document.getElementById('msg').value = '';
                await loadMessages();
            } else {
                // Kontör boşsa veya limit aşılmışsa SweetAlert2 ile net uyarı göster
                const icon = (js.reason === 'CREDIT_EMPTY') ? 'warning' : 'error';
                const title = (js.reason === 'CREDIT_EMPTY') ? 'Kontör Yetersiz' : 'Gönderilemedi';
                if (typeof Swal !== 'undefined') {
                    Swal.fire({
                        icon: icon,
                        title: title,
                        text: js.error_msg || 'Mesaj gönderilemedi.',
                        confirmButtonText: 'Tamam'
                    });
                } else {
                    alert(js.error_msg || 'Gönderilemedi.');
                }
            }
        });

        loadMessages();
        setInterval(loadMessages, 5000);
    </script>
{% endblock %}
