<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İmza Başarılı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f8; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; padding: 40px; }
        .icon-box { width: 80px; height: 80px; background: #e8fff3; color: #50cd89; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 40px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-box">
            <i class="fa-solid fa-check"></i>
        </div>
        <h2 class="mb-3 fw-bold text-dark">Teşekkürler!</h2>
        <p class="text-muted mb-4">
            Sözleşme başarıyla imzalandı ve sistemimize kaydedildi.<br>
            Artık bu sayfayı kapatabilirsiniz.
        </p>
        <div class="d-grid">
            <a href="https://www.kuyumplus.com" class="btn btn-primary btn-lg">Ana Sayfaya Dön</a>
        </div>
    </div>

</body>
</html>
